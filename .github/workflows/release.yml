name: Release

# Publica uma release quando você cria uma tag de versão:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar (self-contained, arquivo único)
        run: dotnet publish src/ShotMark/ShotMark.csproj -c Release -r win-x64 -p:Version=${{ steps.ver.outputs.version }} -o publish/win-x64

      - name: ZIP portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/ShotMark-${{ steps.ver.outputs.version }}-win-x64-portable.zip"

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer/ShotMark.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt

      - name: Notas da versão (CHANGELOG.md)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = @(); $in = $false
          foreach ($l in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($l -match '^## ') {
              if ($in) { break }
              if ($l -match ('^##\s+\[?v?' + [regex]::Escape($v) + '\b')) { $in = $true }
              continue
            }
            if ($in) { $out += $l }
          }
          if ($out.Count -eq 0) { $out = @("Veja o [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).") }
          $out | Set-Content release-notes.md -Encoding utf8

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ShotMark ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*
